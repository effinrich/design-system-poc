name: "Chromatic"

# Run on PRs only, and only when files that can actually affect visual output
# have changed. `ready_for_review` is listed so flipping a draft to ready
# triggers a fresh run; the job-level `if:` keeps it off draft PRs entirely
# (paths alone don't gate on draft state).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - ".storybook/**"
      - "chromatic.config.json"
      - "package.json"
      - "package-lock.json"  - "yarn.lock"
      - ".github/workflows/chromatic.yml"

jobs:
  chromatic:
    name: Run Chromatic
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
        
      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        uses: chromaui/action@v16
        with:
          # ⚠️ Make sure to configure a `CHROMATIC_PROJECT_TOKEN` repository secret
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
